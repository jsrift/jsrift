name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Covers tsconfig.json and tsconfig.test.json: the test tree is not in
      # the build tsconfig, so a type error there is otherwise invisible.
      - run: npm run typecheck

      - run: npm test

      - run: npm run build
